<!DOCTYPE html>
<html>
  <head>
    <title>Algoflix</title>
    <meta charset="UTF-8" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@algolia/autocomplete-theme-classic"
    />
    <link rel="stylesheet" href="/src/assets/app.css" />
  </head>

  <body>
    <div id="root" class="min-h-screen bg-[#17012c] text-white">
      <nav
        class="fixed w-full z-50 transition-colors duration-300 bg-[#17012c]"
      >
        <div class="px-4 md:px-16 py-6 flex flex-col gap-4 flex-row md:items-center md:gap-8">
          <div class="flex items-center space-x-8 w-full md:w-auto">
            <img
              src="/src/assets/logo-algoflix-darkBG-small.svg"
              alt="Algoflix"
              class="h-5"
              onclick="window.location='/'"
            />
            <div class="hidden md:flex items-center space-x-4">
              <a href="/" class="text-sm font-light hover:text-gray-300">
                Home
              </a>
              <a
                href="/category/Action"
                class="text-sm font-light hover:text-gray-300"
              >
                Action
              </a>
              <a
                href="/category/Comedy"
                class="text-sm font-light hover:text-gray-300"
              >
                Comedy
              </a>
            </div>
          </div>

          <div class="flex items-center gap-4 w-full md:flex-1 md:ml-auto ">
            <div class="w-full" id="autocomplete">
              <div className="aa-Autocomplete" role="combobox" aria-expanded="false" aria-haspopup="listbox"
                aria-labelledby="autocomplete-7-label" onClick="window.location.href='/search'"
                >
                <form class="aa-Form" action="" novalidate="" role="search">
                  <div class="aa-InputWrapperPrefix">
                    <label class="aa-Label" aria-label="Submit" for="autocomplete-7-input" id="autocomplete-7-label">
                      <button class="aa-SubmitButton" type="submit" title="Submit">
                        <svg class="aa-SubmitIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                          <path
                            d="M16.041 15.856c-0.034 0.026-0.067 0.055-0.099 0.087s-0.060 0.064-0.087 0.099c-1.258 1.213-2.969 1.958-4.855 1.958-1.933 0-3.682-0.782-4.95-2.050s-2.050-3.017-2.050-4.95 0.782-3.682 2.050-4.95 3.017-2.050 4.95-2.050 3.682 0.782 4.95 2.050 2.050 3.017 2.050 4.95c0 1.886-0.745 3.597-1.959 4.856zM21.707 20.293l-3.675-3.675c1.231-1.54 1.968-3.493 1.968-5.618 0-2.485-1.008-4.736-2.636-6.364s-3.879-2.636-6.364-2.636-4.736 1.008-6.364 2.636-2.636 3.879-2.636 6.364 1.008 4.736 2.636 6.364 3.879 2.636 6.364 2.636c2.125 0 4.078-0.737 5.618-1.968l3.675 3.675c0.391 0.391 1.024 0.391 1.414 0s0.391-1.024 0-1.414z">
                          </path>
                        </svg>
                      </button>
                    </label>
                  </div>
                  <div class="aa-InputWrapper">
                    <input class="aa-Input" aria-autocomplete="both" aria-labelledby="autocomplete-7-label" id="autocomplete-7-input"
                      autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="search" spellcheck="false"
                      placeholder="Search for movies" maxlength="512" type="search" />
                  </div>
                </form>
              </div>
            </div>
            <div class="hidden md:flex items-center space-x-2 cursor-pointer flex-shrink-0">
              <img
                src="https://avatar.iran.liara.run/public/41"
                alt="Profile"
                class="w-8 h-8 rounded"
              />
            </div>
          </div>
        </div>
      </nav>

      <div id="app" class="px-4 md:px-16 pb-24 pt-25 relative z-10"></div>
    </div>

    <script src="/src/app.js" type="module"></script>
  </body>
</html>
