<!DOCTYPE html>
<html>

<head>
  <title>Algoflix</title>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@algolia/autocomplete-theme-classic" />
  <link rel="stylesheet" href="/src/assets/app.css" />
</head>

<body>
  <div id="root" class="min-h-screen bg-[#17012c] text-white">
    <nav class="fixed w-full z-50 transition-colors duration-300 bg-[#17012c]">
      <div class="px-4 md:px-16 py-6 flex flex-col gap-4 flex-row md:items-center md:gap-8">
        <div class="flex items-center space-x-8 w-full md:w-auto">
          <img src="/src/assets/logo-algoflix-darkBG-small.svg" alt="Algoflix" class="h-5"
            onclick="window.location='/'" />
          <div class="hidden md:flex items-center space-x-4">
            <a href="/" class="text-sm font-light hover:text-gray-300">
              Home
            </a>
            <a href="/category/Action" class="text-sm font-light hover:text-gray-300">
              Action
            </a>
            <a href="/category/Comedy" class="text-sm font-light hover:text-gray-300">
              Comedy
            </a>
          </div>
        </div>

        <div class="flex items-center gap-4 w-full md:flex-1 md:ml-auto ">
          <div class="w-full" id="autocomplete">

          </div>
          <div class="hidden md:flex items-center space-x-2 cursor-pointer flex-shrink-0">
            <img src="https://avatar.iran.liara.run/public/41" alt="Profile" class="w-8 h-8 rounded" />
          </div>
        </div>
      </div>
    </nav>

    <div id="app" class="px-4 md:px-16 pb-24 pt-25 relative z-10"></div>
  </div>

  <script src="/src/app.js" type="module"></script>
</body>

</html>
